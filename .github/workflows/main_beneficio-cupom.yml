
name: Deploy Azure Function - beneficio-cupom

on:
  push:
    branches:
      - main
    paths:
      - "backend/azure-function/**"
      - ".github/workflows/main_beneficio-cupom.yml"
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "./backend/azure-function"
  PYTHON_VERSION: "3.14"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check dependencies
        run: python -m pip install -r requirements.txt
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: "beneficio-cupom"
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          sku: "flexconsumption"
          remote-build: true
          respect-funcignore: true
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D654BEC57E604D0ABF813FA4ABAFFE71 }}
